name: Fuzz weekly

# Hostile or random input crashed Scenet over and over, each time found by accident (#378):
# infinity and NaN, control characters, deep nesting, a pattern that backtracked. Fuzzing
# looks on purpose. One oracle, `tests/fuzzing.py`: for any bytes, every entry point answers
# with findings or a ScenetError, within a time and a memory budget, and never prints a
# traceback. Two engines feed it:
#
# - on every pull request, a short Hypothesis run, `fuzz/test_fuzz.py`: real inputs bent
#   byte by byte, documents drawn by `tests/strategies.py` and bent, and any bytes at all;
# - every week, Atheris, coverage-guided, `fuzz/atheris_fuzz.py`, with its corpus kept
#   between runs as a cache. A crash is uploaded, minimised, and the run fails, which opens
#   an issue through the scheduled-run report.
#
# Whatever either finds is kept in `tests/fuzz_regressions/`, which the ordinary suite
# replays. `docs/maintainer/testing.md` says how to reproduce a crash.

on:
  schedule:
    # Wednesdays, 05:00 UTC: away from Monday's mutation run and link check.
    - cron: "0 5 * * 3"
  workflow_dispatch:
    inputs:
      force-failure:
        description: "Fail at once, without fuzzing"
        type: boolean
        default: false
      report:
        description: "Report the result as a scheduled run does: open, comment on or close its issue"
        type: boolean
        default: false
      minutes:
        description: "How long Atheris runs, in minutes"
        type: number
        default: 45

permissions:
  contents: read

jobs:
  atheris:
    name: Coverage-guided fuzzing
    runs-on: ubuntu-26.04
    timeout-minutes: 75
    env:
      MINUTES: ${{ inputs.minutes || 45 }}
    steps:
      - name: Fail on request
        if: inputs.force-failure
        run: |
          echo "::error::Failed on request (force-failure), to test the report of a scheduled run."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true

      - run: uv sync --frozen --group fuzz

      # The corpus every run grew, so each week starts where the last stopped.
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-

      - name: Fuzz
        run: |
          mkdir -p crashes
          uv run python fuzz/atheris_fuzz.py fuzz/corpus \
            -max_total_time=$(( MINUTES * 60 )) -timeout=60 -rss_limit_mb=2048 \
            -artifact_prefix=crashes/ -print_final_stats=1

      - name: Minimise what crashed
        if: failure()
        run: |
          for crash in crashes/crash-* crashes/timeout-* crashes/oom-*; do
            [ -f "$crash" ] || continue
            uv run python fuzz/atheris_fuzz.py -minimize_crash=1 -runs=20000 \
              -exact_artifact_path="$crash.min" "$crash" || true
          done
          ls -l crashes >> "$GITHUB_STEP_SUMMARY"

      - name: Upload what crashed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: crashes/
          if-no-files-found: ignore

      - name: Keep the corpus
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus
          key: fuzz-corpus-${{ github.run_id }}

  # A scheduled run's failure opens an issue, and its next success closes it. A dispatched
  # run reports only when asked to, so trying the fuzzer on a branch cannot close the issue
  # a failing week opened.
  report:
    name: Report the scheduled run
    needs: [atheris]
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.report) }}
    permissions:
      issues: write
    uses: ./.github/workflows/scheduled-report.yml
    with:
      results: ${{ join(needs.*.result, ' ') }}
