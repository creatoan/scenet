name: Mutation testing

# Weekly, and on demand. A pull request's share is the clean run in ci.yml.
#
# Coverage shows which lines ran, not whether any assertion would notice them changing.
# mutmut changes the package one small edit at a time -- `<` to `<=`, a constant nudged --
# and reports every edit the suite still passes. Each of those is a behaviour nothing
# checks. Its survivors are triaged as described in docs/maintainer/testing.md.
#
# One job mutating everything stopped finishing: three weekly runs were cancelled at the
# time limit, and a cancelled job saves no cache, so each started from nothing again (#345).
# The run is split into legs instead, listed in scripts/mutation.py: one job each, each with
# a cache of its own, each failing when its score falls below its threshold or when it
# stops with mutants it never tried.
#
# The second job explores: the property tests with fresh random seeds and 300 examples
# each, where CI always runs the same 20. A failure it finds prints a reproduction; pin
# it as an `@example` and the fixed run covers it from then on.

on:
  schedule:
    # Mondays, 05:00 UTC, before the link check at 07:00.
    - cron: "0 5 * * 1"
  # A change to this workflow, or to the legs, runs it on its own pull request, so a broken
  # configuration is seen before the weekly run, not after.
  pull_request:
    paths:
      - .github/workflows/mutation.yml
      - scripts/mutation.py
  workflow_dispatch:
    inputs:
      legs:
        description: "Run only these legs, comma-separated, as scripts/mutation.py names them (default: every leg)"
        required: false
        default: ""
      path:
        description: "Mutate only this file or glob instead, with no threshold, e.g. src/scenet/solve/camera.py"
        required: false
        default: ""

permissions:
  contents: read

env:
  UV_FROZEN: "1"

jobs:
  legs:
    name: Plan the legs
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # The script needs nothing outside the standard library to plan.
      - name: Plan the legs
        id: plan
        env:
          LEGS: ${{ inputs.legs }}
          ONLY: ${{ inputs.path }}
        run: |
          matrix=$(uv run --no-project python scripts/mutation.py matrix --legs "$LEGS" --path "$ONLY")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  mutmut:
    name: mutmut (${{ matrix.name }})
    needs: legs
    runs-on: ubuntu-26.04
    # Every leg is sized to finish from nothing in well under an hour. The limit is for a
    # leg that has grown, not the expected case.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.legs.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # Every group, as CI's test jobs: mutmut's clean run is the whole suite, and a test
      # that needs a group this skips fails it before a single mutant is tried.
      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      # mutmut resumes, and only re-tests functions whose code changed, so keeping its
      # working directory between runs makes most weeks incremental. Each leg keeps its
      # own: a cache restored from another leg would hold that leg's mutants.
      - name: Restore the previous run
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mutants
          key: mutants-${{ matrix.key }}-${{ hashFiles('uv.lock') }}-${{ github.sha }}
          restore-keys: mutants-${{ matrix.key }}-${{ hashFiles('uv.lock') }}-

      # mutmut copies a file into `mutants/` only when it is not already there, and checks
      # `.py` files by modification time. So a restored cache keeps the first copy of
      # every other file under `src/`, however much the source has moved on. One of them
      # is `scenet-spec.md`, which is generated from the rules and the language reference:
      # `tests/test_spec_pack.py` compares it with a fresh build, and a copy from before
      # the last change fails that test in mutmut's clean run, so no mutant is tried at
      # all. Copy them again; there are four.
      - name: Refresh the files mutmut keeps from the cache
        run: |
          mkdir -p mutants
          git ls-files -z src | grep -zv '\.py$' | xargs -0 -I{} cp --parents -f {} mutants/

      - name: Narrow to the leg
        env:
          PATHS: ${{ matrix.paths }}
        run: |
          read -r -a paths <<< "$PATHS"
          uv run --no-sync python scripts/mutation.py narrow "${paths[@]}"

      # Some mutants allocate without bound: `/` turned into `*` in the rain and snow
      # densities asks for millions of streaks. Uncapped, one of those exhausts the runner's
      # 16 GB before mutmut's timeout fires, and GitHub shuts the runner down mid-run. A
      # test process needs under 1 GB, so a 2 GiB cap per process ends such a mutant with
      # a MemoryError, which counts as killed.
      - name: Run mutmut
        run: |
          ulimit -v 2097152
          uv run mutmut run --max-children 4

      - name: Report
        if: always()
        env:
          LEG: ${{ matrix.name }}
          THRESHOLD: ${{ matrix.threshold }}
        run: |
          uv run mutmut export-cicd-stats || true
          uv run mutmut results > mutants/survivors.txt 2>&1 || true
          {
            echo "### Mutation testing: $LEG"
            echo
            uv run --no-sync python scripts/mutation.py report mutants/mutmut-cicd-stats.json
            echo
            if [ -n "$THRESHOLD" ]; then echo "Threshold: $THRESHOLD%."; else echo "No threshold."; fi
            echo
            echo '<details><summary>Surviving mutants</summary>'
            echo
            echo '```'
            grep -v '^$' mutants/survivors.txt | head -500 || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # The names alone say where a survivor is, not what it changed, and triage needs
      # the change. `mutmut show` prints it as a diff; one file holds them all, so the
      # artifact answers "what does this test have to notice" without a rerun.
      - name: Diff every survivor
        if: always()
        run: |
          grep -E ': survived$' mutants/survivors.txt | sed -E 's/^ *//; s/: survived$//' \
            | while read -r name; do
                echo "=== $name"
                uv run --no-sync mutmut show "$name" 2>&1 || true
                echo
              done > mutants/survivors.diff || true

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutmut-results-${{ matrix.key }}
          path: |
            mutants/mutmut-cicd-stats.json
            mutants/survivors.txt
            mutants/survivors.diff
          if-no-files-found: warn

      # Last, so the summary and the artifact are there to read when it fails. A leg's
      # threshold is its score when it was last triaged, in whole percent, so a drop below
      # it is a survivor nobody has looked at yet. A run on one path has no threshold, and
      # is held only to having tried every mutant.
      - name: Hold the leg to its threshold
        env:
          THRESHOLD: ${{ matrix.threshold }}
        run: uv run --no-sync python scripts/mutation.py gate mutants/mutmut-cicd-stats.json --threshold "$THRESHOLD"

  explore:
    name: Hypothesis exploration
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      # Every group: the root conftest.py loads the documentation's example parsers,
      # which need `docs`, before a single property is collected.
      - name: Sync dependencies
        run: uv sync --frozen --all-groups

      # Random seeds and 300 examples per property. A failure prints a
      # `@reproduce_failure` blob and the shrunk document: pin the document as an
      # `@example` on the property, then fix the bug in its own pull request.
      - name: Explore the property tests
        env:
          HYPOTHESIS_PROFILE: explore
        run: uv run pytest tests/properties --no-cov -p no:cacheprovider -o addopts="" --hypothesis-show-statistics
